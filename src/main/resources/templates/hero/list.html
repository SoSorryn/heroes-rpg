<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Список</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <div class="toolbar">
        <a class="back-inline" th:href="@{/}">← На главную</a>
        <a class="btn-small" th:href="@{${base} + '/new'}">➕ Добавить</a>
    </div>

    <h1 class="title" th:text="${icon} + ' ' + ${title}">Герои</h1>
    <div class="divider"></div>

    <div class="panel">
        <p th:if="${heroes.isEmpty()}" class="empty">Пока никого нет. Добавьте первого!</p>

        <table th:if="${!heroes.isEmpty()}">
            <thead>
            <tr>
                <th>#</th>
                <th>Имя</th>
                <th>Здоровье</th>
                <th th:text="${extraLabel}">Характеристика</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="h : ${heroes}">
                <td th:text="${h.id}">1</td>
                <td th:text="${h.name}">Имя</td>
                <td th:text="${h.health}">100</td>
                <td th:text="${h.extra}">10</td>
                <td class="actions">
                    <a class="btn-small" th:href="@{${base} + '/' + ${h.id} + '/edit'}">✏️ Изменить</a>
                    <form th:action="@{${base} + '/' + ${h.id} + '/delete'}" method="post" style="margin:0;">
                        <button type="submit" class="btn-small btn-danger">🗑 Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
