spring.application.name=heroes

spring.datasource.url=jdbc:postgresql://localhost:5432/heroes
spring.datasource.username=heroes_user
spring.datasource.password=heroes_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Отключаем кэш Thymeleaf, чтобы изменения в HTML подхватывались сразу
spring.thymeleaf.cache=false

app.admin.password=${ADMIN_PASSWORD:admin}

# Автоматически выполнять init.sql при старте
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql